
name: Build and deploy static website to Azure Web App - sahil1

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate website files
        run: |
          test -f index.html
          test -d images
          echo "Website files validated successfully"

      - name: Upload website artifact
        uses: actions/upload-artifact@v4
        with:
          name: website-files
          path: |
            index.html
            *.js
            *.css
            images/
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download website artifact
        uses: actions/download-artifact@v4
        with:
          name: website-files
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_CBAD5407009946E888781E9A1942C50C }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_8EF75B5E63D6496AA9C46FBAF06EACFD }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_62EBEB49C3A94C7E93058F5BE10053C9 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: sahil1
          slot-name: Production
          package: .
